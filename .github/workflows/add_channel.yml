name: Add Channel

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube channel URL (https://www.youtube.com/@Name or .../channel/UC...)"
        type: string
        required: true

# Workflows that commit channels.yml run one at a time so their pushes can't collide.
concurrency:
  group: channels-yml
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Add channel
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_URL: ${{ inputs.url }}
          PYTHONUNBUFFERED: "1"
        run: uv run --frozen --no-dev python add_channel.py "$CHANNEL_URL"

      - name: Commit and push if changed
        env:
          CHANNEL_URL: ${{ inputs.url }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels.yml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add channel ${CHANNEL_URL} to channels.yml" && git push)

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Read through the environment, not ${{ }}, so the URL can't inject script.
          CHANNEL_URL: ${{ inputs.url }}
        with:
          script: |
            const issue_title = '⚠️ Add Channel Failed';
            const issue_body = `## Add Channel Workflow Failed

            The **Add Channel** workflow could not add a channel to \`channels.yml\`.

            ### Error Details
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Time:** ${new Date().toISOString()}
            - **Channel URL:** \`${process.env.CHANNEL_URL}\`

            ### Possible Causes
            - The URL is not a channel URL, @handle, or UC... channel ID
            - No channel matches the URL
            - Missing or invalid \`YOUTUBE_API_KEY\`, or API quota exceeded
            - The push was rejected because \`channels.yml\` changed during the run

            ### Next Steps
            - Review the error message in the workflow logs
            - Fix the cause, then run **Add Channel** again
            - Close this issue once resolved

            ---
            *This issue was automatically created by the Add Channel workflow.*`;

            // Check if an issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['add-channel-error']
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue_title,
                body: issue_body,
                labels: ['add-channel-error', 'automated']
              });
            }
