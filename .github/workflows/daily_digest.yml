name: YouTube Daily Digest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # to find the last successful digest run
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      # The digest covers videos published since the last successful run started,
      # so a late, failed, or skipped run neither drops nor repeats videos.
      # Empty on the first run, which falls back to the last 24 hours.
      - name: Find the last successful digest run
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily_digest.yml \
            --status success --limit 1 --json startedAt --jq '.[0].startedAt // ""')
          echo "Last successful run started: ${since:-none}"
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Run digest script
        id: digest
        env:
          DIGEST_SINCE: ${{ steps.since.outputs.since }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: uv run --frozen --no-dev python digest.py

      - name: Create issue on failure
        if: failure() && (steps.since.outcome == 'failure' || steps.digest.outcome == 'failure')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issue_title = '⚠️ YouTube Daily Digest Failed';
            const issue_body = `## Daily Digest Workflow Failed
            
            The **YouTube Daily Digest** workflow encountered an error.
            
            ### Error Details
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Time:** ${new Date().toISOString()}
            - **Branch:** ${{ github.ref_name }}
            
            ### Possible Causes
            - Missing or invalid API keys (YouTube, Gemini)
            - Gmail authentication issues
            - API quota exceeded
            - Network connectivity problems
            
            ### How to Diagnose
            
            1. **Check the workflow logs:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. **Verify all secrets are set:**
               - \`YOUTUBE_API_KEY\`
               - \`GEMINI_API_KEY\`
               - \`GMAIL_USER\`
               - \`GMAIL_APP_PASSWORD\`
               - \`RECIPIENT_EMAIL\`
            3. **Test locally:**
               \`\`\`bash
               uv run python digest.py
               \`\`\`
            
            ### Next Steps
            - Review the error message in the workflow logs
            - Verify API keys and quotas
            - Test the script locally to reproduce the issue
            - Close this issue once resolved
            
            ---
            *This issue was automatically created by the Daily Digest workflow.*`;
            
            // Check if an issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['digest-error']
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue_title,
                body: issue_body,
                labels: ['digest-error', 'automated']
              });
            }
