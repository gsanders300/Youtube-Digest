name: Repair Channel IDs

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply fixes and commit channels.yml (leave unchecked for a dry-run report only)"
        type: boolean
        default: false

# Workflows that commit channels.yml run one at a time so their pushes can't collide.
concurrency:
  group: channels-yml
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Repair channel IDs
        id: repair
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APPLY: ${{ inputs.apply }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$APPLY" = "true" ]; then
            uv run --frozen --no-dev python repair_channel_ids.py --write
          else
            uv run --frozen --no-dev python repair_channel_ids.py
          fi

      - name: Commit and push if changed
        if: ${{ inputs.apply }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels.yml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Repair channel IDs in channels.yml" && git push)

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_title = '⚠️ Repair Channel IDs Failed';
            const issue_body = `## Repair Channel IDs Workflow Failed

            The **Repair Channel IDs** workflow encountered an error.

            ### Error Details
            - **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Time:** ${new Date().toISOString()}
            - **Apply:** ${{ inputs.apply }}

            ### Possible Causes
            - Missing or invalid \`YOUTUBE_API_KEY\`, or API quota exceeded
            - Network connectivity problems
            - The push was rejected because \`channels.yml\` changed during the run

            ### Next Steps
            - Review the error message in the workflow logs
            - Fix the cause, then run **Repair Channel IDs** again
            - Close this issue once resolved

            ---
            *This issue was automatically created by the Repair Channel IDs workflow.*`;

            // Check if an issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['repair-error']
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue_title,
                body: issue_body,
                labels: ['repair-error', 'automated']
              });
            }
