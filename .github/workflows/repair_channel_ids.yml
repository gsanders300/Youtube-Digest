name: Repair Channel IDs

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply fixes and commit channels.yml (leave unchecked for a dry-run report only)"
        type: boolean
        default: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Repair channel IDs
        id: repair
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            uv run --frozen --no-dev python repair_channel_ids.py --write
          else
            uv run --frozen --no-dev python repair_channel_ids.py
          fi

      - name: Commit and push if changed
        if: ${{ inputs.apply }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels.yml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Repair channel IDs in channels.yml" && git push)
