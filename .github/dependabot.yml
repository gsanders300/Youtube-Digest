version: 2

# Weekly grouped updates. dependabot-auto-merge.yml merges the minor and patch groups once
# the test check passes, and each merge becomes a patch release. Major versions get their
# own "-major" groups, which auto-merge skips: review and merge those by hand.
# Pushing a change to this file starts a Dependabot run right away.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: America/New_York
    # Without this, only the direct dependencies are checked, not the rest of uv.lock.
    allow:
      - dependency-type: all
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [minor, patch]
      python-packages-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
      github-actions-major:
        patterns: ["*"]
        update-types: [major]
